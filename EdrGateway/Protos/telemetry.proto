syntax = "proto3";

option csharp_namespace = "EdrGateway.Protos";

package telemetry;

// O serviço de ingestão que o Agente vai consumir
service TelemetryIngestor {
  // Usamos 'stream' para manter uma conexão TCP aberta e enviar dados em tempo real
  rpc StreamEvents (stream TelemetryEvent) returns (AckReply);
}

// A estrutura exata do nosso log de segurança
message TelemetryEvent {
  string agent_id = 1;
  string severity = 2;
  string event_type = 3;
  string process_name = 4;
  string command_line = 5;
  string parent_process = 6;
}

message AckReply {
  bool success = 1;
  string message = 2;
}